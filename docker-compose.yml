services:
  postgres:
    image: postgres:16
    container_name: compacultivo-db
    environment:
      POSTGRES_DB: compacultivo
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - compacultivo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d compacultivo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  compacultivo-data:
